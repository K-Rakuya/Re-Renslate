[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renloc-qe"
version = "0.1.0"
description = "Isolated Quality Estimation Worker running unbabel-comet on numpy < 2.0"
requires-python = ">=3.9,<=3.12"
authors = [{ name = "Renslate Core Team" }]
dependencies = [
    "numpy>=1.20.0,<2.0.0",
    "setuptools<70",
    "unbabel-comet>=2.2.0; python_version <= '3.12'",
    "torch>=2.0.0; python_version <= '3.12'",
    "sentencepiece>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["renloc_qe"]
