[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renloc-core"
version = "0.1.0"
description = "Core localization engine for Renslate (AST reader, Static ICFG Analyzer, LLM Engine, SQLite Single-Writer)"
requires-python = ">=3.12"
authors = [{ name = "Renslate Core Team" }]
dependencies = [
    "numpy>=2.0.0",
    "msgspec>=0.18.6",
    "xdis>=6.1.1",
    "uharfbuzz>=0.39.0",
    "pynvml>=11.5.0; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.optional-dependencies]
sqlite = ["apsw>=3.45.0"]
inference = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["renloc_core"]
