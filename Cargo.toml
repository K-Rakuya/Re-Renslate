[workspace]
resolver = "2"
members = [
    "crates/renloc-rpa",
    "crates/renloc-shaper",
    "crates/renloc-db",
    "crates/renloc-pyext",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Renslate Core Team"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
